<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>방봄 BANGBOM</title>
<meta name="description" content="대구 노후주택, 고쳐 살까 이사 갈까? 우리 가구 그대로 3D로 미리 배치해 보고 리모델링 견적과 이사 비용, 집수리 지원금까지 한 번에 비교해요. 내 조건으로 들어갈 수 있는 대구 미분양 집도 지도에서 찾아줘요.">
<meta name="theme-color" content="#f3f2ee">
<meta property="og:type" content="website">
<meta property="og:site_name" content="방봄 BANGBOM">
<meta property="og:title" content="방봄 BANGBOM · 대구에 좋은 매물 있는데, 함께 보시겠어요?">
<meta property="og:description" content="내 조건을 넣으면 대구 미분양 지도에서 들어갈 수 있는 단지에 불이 켜지고, 집 안은 3D로 미리 둘러봐요.">
<meta property="og:image" content="img/hero.jpg">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="방봄 BANGBOM · 대구에 좋은 매물 있는데, 함께 보시겠어요?">
<meta name="twitter:description" content="내 조건으로 들어갈 수 있는 대구 미분양 단지를 찾고, 집 안은 3D로 미리 둘러봐요.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">

<style>
/* ═════════ 디자인 토큰 ═════════ */
:root{
  color-scheme:light;
  --bg:#f3f2ee; --white:#ffffff; --card:#fcfbf9; --gray:#efeeea;
  --ink:#141714; --sub:#71746f; --line:#e3e1db;
  --green:#1f6b4f; --green-soft:#e2efe7; --warn:#c2563a;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:48px; --s6:64px; --s7:96px; --s8:128px;
  --section-y:clamp(80px,9vw,128px);
  --pad-x:max(4vw,18px);
  --max:1360px;
  --r-photo:16px; --r-3d:20px; --r-pill:999px;
  --nav-h:72px; --tab-h:64px;
  --kr:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --en:"Instrument Serif",Georgia,"Times New Roman",serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--kr);font-size:16px;line-height:1.65;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
img,video{max-width:100%;display:block}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
img.is-missing{opacity:0}

/* ═════════ 공통 ═════════ */
.container{max-width:var(--max);margin:0 auto;padding:0 var(--pad-x)}
.section{padding:var(--section-y) 0}
.section--white{background:var(--white)}
.section--gray{background:var(--gray)}
.eyebrow{display:block;font-family:var(--en);font-style:italic;font-weight:400;font-size:22px;line-height:1.2;letter-spacing:0;color:var(--green);margin:0 0 var(--s2)}
.title{font-weight:600;letter-spacing:-0.045em;line-height:1.25;font-size:clamp(30px,3.2vw,44px)}
.title em{font-style:normal;color:var(--green)}
.lead{color:var(--sub);margin-top:var(--s2);max-width:640px}
.head-center{text-align:center;margin:0 auto var(--s6);max-width:720px}
.head-center .lead{margin-left:auto;margin-right:auto}
.muted{color:var(--sub)}
.small{font-size:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s1);height:48px;padding:0 var(--s3);border-radius:var(--r-pill);background:var(--ink);color:#fff;font-weight:600;font-size:15px;letter-spacing:-0.02em;white-space:nowrap;transition:transform .15s ease,background .15s ease,opacity .15s}
.btn:hover{background:#000}
.btn:active{transform:scale(.98)}
.btn--white{background:#fff;color:var(--ink)}
.btn--white:hover{background:#f1f0ec}
.btn--ghost{background:rgba(255,255,255,.62);color:var(--ink);border:1px solid rgba(20,23,20,.08);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.btn--ghost:hover{background:rgba(255,255,255,.85)}
.btn--line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn--line:hover{background:var(--gray)}
.btn--sm{height:40px;padding:0 var(--s2);font-size:14px}
.btn[disabled]{opacity:.35;pointer-events:none}
.link{display:inline-flex;gap:6px;font-weight:600;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.link:hover{color:var(--green)}

.tag-example{display:inline-block;font-size:12px;font-weight:600;line-height:1;letter-spacing:0;padding:6px 10px;border-radius:var(--r-pill);background:rgba(255,255,255,.9);color:var(--sub);border:1px solid var(--line);white-space:nowrap}
.tag-inline{display:inline-block;font-size:11px;font-weight:600;line-height:1;padding:4px 7px;border-radius:var(--r-pill);background:var(--gray);color:var(--sub);vertical-align:2px;margin-left:4px;letter-spacing:0;white-space:nowrap}

/* 칩 */
.chips{display:flex;flex-wrap:wrap;gap:var(--s1)}
.chip{height:38px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:#fff;font-size:14px;font-weight:500;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.chip:hover{border-color:#c9c7c0}
.chip.is-on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* 상태 알약: 요건 충족 / 확인 필요 / 미충족 */
.st{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-pill);font-size:12px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st--ok{background:var(--green-soft);color:var(--green)}
.st--check{background:#fff;color:var(--ink);border:1px dashed #b9b7b0}
.st--no{background:var(--gray);color:var(--sub)}

/* 시그니처 치수선 ├── 90cm ──┤ */
.dim{display:flex;align-items:center;gap:var(--s1);color:var(--ink);font-size:12px;font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums;line-height:1}
.dim::before,.dim::after{content:"";flex:1;height:9px;background:linear-gradient(currentColor,currentColor) center/100% 1px no-repeat}
.dim::before{border-left:1px solid currentColor}
.dim::after{border-right:1px solid currentColor}
.dim--v{flex-direction:column;height:100%}
.dim--v::before,.dim--v::after{width:9px;height:auto;background:linear-gradient(currentColor,currentColor) center/1px 100% no-repeat;border:0}
.dim--v::before{border-top:1px solid currentColor}
.dim--v::after{border-bottom:1px solid currentColor}

/* 나타나기 */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.reveal.is-in{opacity:1;transform:none}

/* ═════════ 네비 ═════════ */
.nav{position:fixed;inset:0 0 auto 0;z-index:50;height:var(--nav-h);background:rgba(243,242,238,.8);color:var(--ink);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid rgba(20,23,20,.06);transition:background .25s,color .25s,border-color .25s}
.nav.is-clear{background:transparent;color:#fff;border-bottom-color:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.nav__inner{height:100%;max-width:var(--max);margin:0 auto;padding:0 var(--pad-x);display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.logo{display:flex;align-items:baseline;gap:var(--s1);line-height:1;white-space:nowrap}
.logo b{font-weight:700;font-size:22px;letter-spacing:-0.05em}
.logo i{font-family:var(--en);font-style:italic;font-size:20px;letter-spacing:0;opacity:.75}
.nav__right{display:flex;align-items:center;gap:var(--s4)}
.nav__links{display:flex;align-items:center;gap:28px;margin:0;padding:0;list-style:none}
.nav__link{display:flex;flex-direction:column;align-items:center;line-height:1.2;padding:var(--s1) 0;position:relative}
.nav__link span{font-size:15px;font-weight:600;letter-spacing:-0.03em;white-space:nowrap}
.nav__link small{font-size:10px;font-weight:500;letter-spacing:.08em;opacity:.55;margin-top:2px}
.nav__link::after{content:"";position:absolute;left:50%;bottom:0;width:0;height:1px;background:currentColor;transition:width .2s,left .2s}
.nav__link:hover::after,.nav__link.is-active::after{width:100%;left:0}
.nav__actions{display:flex;align-items:center;gap:var(--s1)}
.nav .btn{height:44px;padding:0 20px;font-size:14px}
.nav.is-clear .btn:not(.btn--ghost){background:#fff;color:var(--ink)}
.nav.is-clear .btn--ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.28)}
.menu-btn{line-height:1}
.menu-btn .burger{display:flex;flex-direction:column;justify-content:space-between;width:14px;height:10px;flex:none}
.menu-btn .burger i{display:block;height:1.5px;width:100%;background:currentColor;border-radius:2px}

/* 메뉴 패널 */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(20,23,20,.32);opacity:0;pointer-events:none;transition:opacity .3s}
.panel{position:fixed;top:0;right:0;bottom:0;z-index:70;width:min(440px,100%);background:var(--white);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s;visibility:hidden}
body.menu-open .scrim{opacity:1;pointer-events:auto}
body.menu-open .panel{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.2,.8,.2,1)}
body.menu-open{overflow:hidden}
.panel__head{height:var(--nav-h);flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 var(--s4);border-bottom:1px solid var(--line)}
.close-btn{width:44px;height:44px;border-radius:var(--r-pill);border:1px solid var(--line);display:grid;place-items:center}
.close-btn:hover{background:var(--gray)}
.panel__body{flex:1;overflow:auto;padding:var(--s3) var(--s4)}
.panel__list{list-style:none;margin:0;padding:0}
.panel__list a{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);padding:20px 0;border-bottom:1px solid var(--line)}
.panel__list b{font-size:24px;font-weight:600;letter-spacing:-0.045em}
.panel__list i{font-family:var(--en);font-style:italic;font-size:18px;color:var(--sub);letter-spacing:0}
.panel__list a.is-active b{color:var(--green)}
.panel__foot{padding:var(--s4);border-top:1px solid var(--line);flex:none}
.panel__foot .btn{width:100%;height:50px}
.panel__note{font-size:13px;color:var(--sub);margin-top:var(--s2)}

/* ═════════ 페이지 ═════════ */
main{min-height:100vh}
.page{display:none}
.page.is-active{display:block}
.no-vt .page.is-active{animation:pageIn .45s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}}
/* 페이지 전환 (View Transitions) */
.nav{view-transition-name:nav}
.tabbar{view-transition-name:tabbar}
::view-transition-old(root){animation:vtOut .2s ease both}
::view-transition-new(root){animation:vtIn .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes vtOut{to{opacity:0;transform:translateY(-10px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(16px)}}
/* 탭 전환 공통 */
@keyframes tabIn{from{opacity:0;transform:translateY(10px)}}
.page-head{padding-top:calc(var(--nav-h) + var(--s6));padding-bottom:var(--s5)}
.page-head .lead{max-width:720px}

/* ═════════ 홈: 히어로 ═════════ */
.hero{position:relative;height:100svh;min-height:600px;max-height:980px;background:#1d211d;color:#fff;overflow:hidden;display:flex;align-items:flex-end}
.hero__media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero__shade{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(12,14,12,.42) 0%,rgba(12,14,12,0) 24%),
  linear-gradient(90deg,rgba(12,14,12,.74) 0%,rgba(12,14,12,.38) 46%,rgba(12,14,12,0) 78%),
  linear-gradient(0deg,rgba(12,14,12,.66) 0%,rgba(12,14,12,0) 56%)}
.hero .tag-example{position:absolute;top:calc(var(--nav-h) + var(--s2));right:var(--pad-x);z-index:2}
.hero__inner{position:relative;z-index:2;width:100%;padding-bottom:clamp(112px,13vh,150px)}
.hero__en{font-family:var(--en);font-style:italic;font-size:clamp(20px,1.8vw,24px);letter-spacing:0;color:rgba(255,255,255,.86);margin-bottom:var(--s3)}
.hero__title{font-size:clamp(40px,5.6vw,76px);line-height:1.08;letter-spacing:-0.055em;font-weight:600}
.hero__title span{display:block}
.hero__title .thin{font-weight:400;opacity:.92}
.hero__desc{margin-top:var(--s3);max-width:500px;font-size:clamp(16px,1.25vw,18px);color:rgba(255,255,255,.82)}
.hero__btns{display:flex;flex-wrap:wrap;gap:var(--s1);margin-top:var(--s4)}
.hero__btns .btn{height:50px}
.hero__btns .btn--ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
.hero__btns .btn--ghost:hover{background:rgba(255,255,255,.24)}
.scroll-cue{position:absolute;left:50%;bottom:var(--s3);transform:translateX(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:var(--s1);font-family:var(--en);font-style:italic;font-size:16px;letter-spacing:0;color:rgba(255,255,255,.75)}
.scroll-cue i{display:block;width:1px;height:48px;background:linear-gradient(rgba(255,255,255,.8),rgba(255,255,255,0));animation:cue 2.2s ease-in-out infinite;transform-origin:top}
@keyframes cue{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

/* 숫자 띠 */
.stats{background:var(--white);border-bottom:1px solid var(--line)}
.stats__grid{display:grid;grid-template-columns:repeat(3,1fr)}
.stat{text-align:center;padding:var(--s6) var(--s3)}
.stat + .stat{border-left:1px solid var(--line)}
.stat__num{color:var(--green);font-weight:500;font-size:clamp(40px,4.4vw,60px);line-height:1.1;letter-spacing:-0.04em;font-variant-numeric:tabular-nums}
.stat__num small{font-size:clamp(16px,1.4vw,20px);color:var(--ink);font-weight:600;margin-left:4px;letter-spacing:-0.02em}
.stat__label{margin-top:var(--s1);font-weight:600}
.stat__src{margin-top:4px;font-size:13px;color:var(--sub)}

/* 구조 갤러리 */
.plans__head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s5)}
.plans__track{display:flex;gap:var(--s3);overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:var(--pad-x);padding:0 var(--pad-x) var(--s2);margin:0 calc(var(--pad-x) * -1);scrollbar-width:none}
.plans__track::-webkit-scrollbar{display:none}
.plan-card{flex:0 0 clamp(272px,30vw,420px);scroll-snap-align:start;text-align:left}
.plan-card__media{position:relative;aspect-ratio:4/3;border-radius:var(--r-photo);overflow:hidden;background:var(--card);border:1px solid var(--line)}
.plan-card__media img,.plan-card__media svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plan-card__media .tag-example{position:absolute;right:12px;bottom:12px}
.plan-card:hover .plan-card__media{border-color:#cfccc4}
.plan-card__name{margin-top:var(--s2);font-size:18px;font-weight:600;letter-spacing:-0.03em}
.plan-card__meta{font-size:14px;color:var(--sub)}
.plans__btns{display:flex;gap:var(--s1);margin-top:var(--s3)}
.round-btn{width:48px;height:48px;border-radius:var(--r-pill);border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.round-btn:hover{background:var(--gray)}

/* How it helps 탭 */
.zz-tabs{display:flex;justify-content:center;gap:6px;margin:0 auto var(--s5);flex-wrap:wrap}
.zz-tabs__sep{display:inline-flex;align-items:center;padding:0 6px 0 14px;margin-left:8px;border-left:1px solid var(--line);font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap}
.zz-tab{display:inline-flex;align-items:baseline;gap:8px;height:46px;padding:0 18px;border-radius:var(--r-pill);border:1px solid var(--line);background:#fff;font-weight:600;font-size:15px;white-space:nowrap;align-items:center}
.zz-tab i{font-family:var(--en);font-style:italic;font-weight:400;font-size:17px;letter-spacing:0;color:var(--green)}
.zz-tab.is-on{background:var(--ink);color:#fff;border-color:var(--ink)}
.zz-tab.is-on i{color:#9fd0b8}
.zz--tabbed .zz__row{display:none}
.zz--tabbed .zz__row.is-on{display:grid;animation:tabIn .5s cubic-bezier(.2,.7,.2,1) backwards}
.zz--tabbed .zz__row.is-rev .zz__media{order:0}
.zz-nav{display:flex;justify-content:center;gap:var(--s1);margin-top:var(--s5)}
/* 지그재그 */
.zz{display:flex;flex-direction:column;gap:clamp(64px,8vw,112px)}
.zz__row{display:grid;grid-template-columns:7fr 5fr;gap:clamp(32px,5vw,80px);align-items:center}
.zz__row.is-rev .zz__media{order:2}
.zz__media{position:relative;aspect-ratio:3/2;border-radius:var(--r-photo);overflow:hidden;background:#d9d6ce}
.zz__media > img,.zz__media > video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.zz__media .tag-example{position:absolute;right:14px;bottom:14px;z-index:4}
.zz__no{font-family:var(--en);font-style:italic;font-size:20px;letter-spacing:0;color:var(--green);margin-bottom:var(--s1)}
.zz__title{font-size:clamp(26px,2.4vw,34px);font-weight:600;letter-spacing:-0.045em;line-height:1.3}
.zz__text p{margin-top:var(--s2);color:#3d413d}
.zz__hint{display:block;margin-top:var(--s2);font-size:14px;color:var(--green);font-weight:500}
.zz__text .link{margin-top:var(--s3)}
.media-dim{position:absolute;left:18px;bottom:18px;top:30%;z-index:3;color:#fff;font-size:12px}

/* 비포/애프터 */
.ba{--p:100%;position:absolute;inset:0;user-select:none}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba__before{clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.ba__line{position:absolute;top:0;bottom:0;left:var(--p);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 14px 2px rgba(255,214,160,.85),0 0 40px 6px rgba(255,200,130,.35);z-index:2;pointer-events:none}
.ba__knob{position:absolute;top:50%;left:var(--p);width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:18px;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.18);z-index:3;pointer-events:none}
.ba__range{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;z-index:5;-webkit-appearance:none;appearance:none;touch-action:pan-y}
.pill-label{position:absolute;top:14px;z-index:4;height:30px;padding:0 12px;border-radius:var(--r-pill);font-size:13px;font-weight:600;display:inline-flex;align-items:center}
.pill-label--l{left:14px;background:#fff;color:var(--ink)}
.pill-label--r{right:14px;background:var(--green);color:#fff}

/* 미니 지도(홈) */
.mini-map{position:absolute;inset:0;background:#20241f}
.mini-map svg{width:100%;height:100%}

/* 이야기 */
.story{display:grid;grid-template-columns:5fr 7fr;gap:clamp(32px,6vw,96px);align-items:start}
.story__fig{margin:0}
.story__img{position:relative;aspect-ratio:4/5;border-radius:var(--r-photo);overflow:hidden;background:#d9d6ce}
.story__img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.story__img .tag-example{position:absolute;right:14px;bottom:14px}
.story__fig figcaption{margin-top:var(--s2);font-size:14px;color:var(--sub)}
.story__body p{margin-top:var(--s3);color:#3d413d}
.story__list{list-style:none;padding:0;margin:var(--s5) 0 var(--s5);border-top:1px solid var(--line)}
.story__list li{display:grid;grid-template-columns:minmax(180px,.9fr) 1.4fr;gap:var(--s3);padding:20px 0;border-bottom:1px solid var(--line)}
.story__list b{font-weight:600;letter-spacing:-0.03em}
.story__list span{color:var(--sub)}

/* 마무리 배너 */
.cta{position:relative;height:440px;border-radius:var(--r-3d);overflow:hidden;background:#1d211d;color:#fff;display:grid;place-items:center;text-align:center}
.cta > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cta::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.5)}
.cta__inner{position:relative;z-index:2;padding:0 var(--s3)}
.cta__en{font-family:var(--en);font-style:italic;font-size:22px;letter-spacing:0;color:rgba(255,255,255,.85)}
.cta__title{margin-top:var(--s2);font-size:clamp(30px,3.6vw,48px);font-weight:600;letter-spacing:-0.05em;line-height:1.2}
.cta .btn{margin-top:var(--s4);height:50px}
.cta .tag-example{position:absolute;top:16px;right:16px;z-index:3}

/* ═════════ 집 찾기(#map) ═════════ */
.map-layout{display:grid;grid-template-columns:360px 1fr;gap:var(--s3);align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-photo)}
.cond{position:sticky;top:calc(var(--nav-h) + var(--s3));padding:var(--s3)}
.cond h2{font-size:20px;font-weight:600;letter-spacing:-0.04em}
.cond__persona{display:flex;gap:6px;flex-wrap:wrap;margin:var(--s2) 0 var(--s3)}
.field{padding:14px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field__label{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s1);font-size:14px;font-weight:600;margin-bottom:10px}
.field__label small{font-weight:400;color:var(--sub);font-size:12px}
.input-row{display:flex;align-items:center;gap:var(--s1)}
.input{width:100%;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:15px;font-variant-numeric:tabular-nums}
.input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.input-unit{font-size:14px;color:var(--sub);white-space:nowrap}
.seg{display:inline-flex;padding:3px;border-radius:var(--r-pill);background:var(--gray);gap:2px;width:100%}
.seg button{flex:1;height:36px;border-radius:var(--r-pill);font-size:14px;font-weight:500;color:var(--sub);white-space:nowrap;padding:0 10px}
.seg button.is-on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(20,23,20,.08)}
.cond__note{margin-top:var(--s2);font-size:12px;color:var(--sub);line-height:1.55}

.mapstage{position:relative;height:min(72vh,680px);min-height:440px;border-radius:var(--r-3d);overflow:hidden;background:radial-gradient(110% 90% at 50% 45%,#2c322b 0%,#1b1f1a 100%);color:#fff}
.mapstage canvas{display:block;width:100%;height:100%;touch-action:pan-y}
.legend{position:absolute;top:16px;left:16px;z-index:3;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 32px)}
.legend span{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-pill);background:rgba(20,23,20,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:13px;font-weight:500;white-space:nowrap}
.legend i{width:9px;height:9px;border-radius:50%}
.lg-on{background:#ffe2a8;box-shadow:0 0 8px 2px rgba(255,214,140,.8)}
.lg-blink{background:#ffe2a8;animation:blink 1.2s ease-in-out infinite}
.lg-off{background:#5b605a}
@keyframes blink{50%{opacity:.25}}
.mapstage .tag-example{position:absolute;top:16px;right:16px;z-index:3}
.map-hint{position:absolute;right:16px;bottom:16px;z-index:3;font-size:12px;color:rgba(255,255,255,.6)}
.map-card{position:absolute;left:16px;bottom:16px;z-index:4;width:min(340px,calc(100% - 32px));background:#fff;color:var(--ink);border-radius:var(--r-photo);padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.22);transform:translateY(12px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.map-card.is-open{opacity:1;transform:none;pointer-events:auto}
.map-card__top{display:flex;justify-content:space-between;gap:var(--s1);align-items:flex-start}
.map-card h3{font-size:18px;font-weight:600;letter-spacing:-0.03em;line-height:1.35}
.map-card__meta{font-size:13px;color:var(--sub)}
.map-card__num{margin-top:12px;font-size:30px;font-weight:600;letter-spacing:-0.04em;color:var(--green);line-height:1.2}
.map-card__num small{font-size:14px;color:var(--ink);font-weight:500}
.map-card__range{font-size:13px;color:var(--sub);margin-top:2px}
.map-card__reason{font-size:13px;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--gray)}
.map-card__btns{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.map-card .close-btn{width:32px;height:32px;flex:none}
.map-fallback{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:var(--s4);color:rgba(255,255,255,.7);font-size:14px}
.no3d .map-fallback{display:grid}

.ulist{margin-top:var(--s3);display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--s2)}
.uitem{padding:18px 20px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.uitem:hover{border-color:#c9c7c0}
.uitem.is-sel{border-color:var(--ink)}
.uitem__top{display:flex;justify-content:space-between;align-items:center;gap:var(--s1)}
.uitem b{font-weight:600;letter-spacing:-0.03em}
.uitem__meta{font-size:13px;color:var(--sub)}
.uitem__num{font-size:15px;font-weight:600}
.uitem__num em{font-style:normal;color:var(--green)}
.ulist__note{margin-top:var(--s2);font-size:13px;color:var(--sub)}

/* ═════════ 미리 살아보기(#sim) ═════════ */
.sim-layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:var(--s3);align-items:start}
.stage{position:relative;height:min(70vh,640px);min-height:420px;border-radius:var(--r-3d);overflow:hidden;background:radial-gradient(120% 90% at 50% 38%,#fbfaf7 0%,#eceae4 62%,#e2e0d9 100%)}
.stage canvas{display:block;width:100%;height:100%;touch-action:pan-y}
.stage.is-walk canvas{touch-action:none}
.prow{position:absolute;left:0;right:0;z-index:4;display:flex;gap:6px;overflow-x:auto;padding:0 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.prow::-webkit-scrollbar{display:none}
.prow--top{top:14px}
.prow--bot{bottom:14px;right:110px}
.pill{flex:none;height:36px;padding:0 14px;border-radius:var(--r-pill);font-size:13px;font-weight:600;white-space:nowrap;background:rgba(255,255,255,.72);border:1px solid rgba(20,23,20,.08);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.pill:hover{background:rgba(255,255,255,.92)}
.pill.is-on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill[disabled]{opacity:.4;pointer-events:none}
.pgroup{flex:none;display:inline-flex;gap:2px;padding:3px;border-radius:var(--r-pill);background:rgba(255,255,255,.6);border:1px solid rgba(20,23,20,.08);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pgroup .pill{height:30px;background:transparent;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0 12px}
.pgroup .pill.is-on{background:var(--ink)}
.pdot{width:6px;height:6px;border-radius:50%;background:var(--warn)}
.score{position:absolute;right:14px;bottom:14px;z-index:5;width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center;text-align:center;border:1px solid rgba(20,23,20,.06)}
.score svg{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);transform:rotate(-90deg)}
.score b{display:block;font-size:24px;font-weight:600;letter-spacing:-0.04em;line-height:1;font-variant-numeric:tabular-nums}
.score small{display:block;font-size:10px;color:var(--sub);margin-top:3px;font-weight:600}
.stage-hint{position:absolute;left:50%;top:60px;transform:translateX(-50%);z-index:3;font-size:12px;color:var(--sub);background:rgba(255,255,255,.7);padding:6px 12px;border-radius:var(--r-pill);white-space:nowrap;pointer-events:none;transition:opacity .4s}
.stage-tip{position:absolute;left:14px;top:60px;z-index:3;font-size:12px;font-weight:600;color:#fff;background:var(--warn);padding:6px 10px;border-radius:var(--r-pill);display:none}
.stage.is-eye .stage-tip{display:block}
.pad{position:absolute;left:14px;bottom:60px;z-index:5;display:none;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px}
.stage.is-walk .pad{display:grid}
.pad button{border-radius:12px;background:rgba(255,255,255,.82);border:1px solid rgba(20,23,20,.08);display:grid;place-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);touch-action:none;user-select:none;-webkit-user-select:none}
.pad button:active{background:#fff}
.pad .up{grid-column:2}
.pad .lt{grid-column:1;grid-row:2}.pad .dn{grid-column:2;grid-row:2}.pad .rt{grid-column:3;grid-row:2}
.eye-dim{position:absolute;right:120px;bottom:70px;top:auto;height:90px;z-index:3;display:none;color:var(--ink)}
.stage.is-eye .eye-dim{display:flex}
.stage .no3d-msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:var(--sub);font-size:14px;padding:var(--s4)}
.stage.no3d .no3d-msg{display:grid}

.spanel{position:sticky;top:calc(var(--nav-h) + var(--s3));display:flex;flex-direction:column;max-height:calc(100vh - var(--nav-h) - 48px);overflow:hidden}
.steps{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);flex:none}
.steps button{padding:14px 4px 12px;text-align:center;font-size:13px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px;line-height:1.3}
.steps button i{display:block;font-family:var(--en);font-style:italic;font-weight:400;font-size:17px;letter-spacing:0}
.steps button.is-on{color:var(--ink);border-bottom-color:var(--ink)}
.steps button.is-on i{color:var(--green)}
.spanel__body{flex:1;overflow:auto;padding:var(--s1) var(--s3) var(--s3)}
.spanel__foot{flex:none;display:flex;gap:var(--s1);padding:14px var(--s3);border-top:1px solid var(--line);background:var(--card)}
.spanel__foot .btn{flex:1;height:46px}
.step{display:none}
.step.is-on{display:block}
.subhead{font-size:14px;font-weight:600;margin:6px 0 10px}
.note-ex{font-size:12px;color:var(--sub);margin-top:6px}
.sugg{list-style:none;margin:6px 0 0;padding:6px;border:1px solid var(--line);border-radius:12px;background:#fff;display:none;max-height:200px;overflow:auto}
.sugg.is-open{display:block}
.sugg li button{width:100%;text-align:left;padding:10px;border-radius:8px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.sugg li button:hover{background:var(--gray)}
.sugg small{color:var(--sub)}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tpl{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left}
.tpl b{display:block;font-size:14px;font-weight:600}
.tpl span{font-size:12px;color:var(--sub)}
.tpl.is-on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--green)}
.counter{display:flex;align-items:center;gap:var(--s2)}
.counter button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px}
.counter b{min-width:40px;text-align:center;font-size:18px;font-variant-numeric:tabular-nums}
.units{display:grid;gap:6px}
.unit{display:flex;justify-content:space-between;align-items:center;gap:var(--s1);padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left}
.unit.is-on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.unit b{font-size:14px;font-weight:600;display:block}
.unit span{font-size:12px;color:var(--sub)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:1px solid rgba(20,23,20,.12);position:relative}
.sw.is-on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--ink)}
.reasons{list-style:none;padding:0;margin:6px 0 0}
.reasons li{position:relative;padding:8px 0 8px 18px;font-size:14px;border-bottom:1px solid var(--line)}
.reasons li::before{content:"";position:absolute;left:2px;top:17px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.reasons li.is-warn::before{background:var(--warn)}
.sim-sum{margin-top:var(--s2);display:flex;gap:var(--s1);flex-wrap:wrap}

/* ═════════ 비교 리포트(#report) ═════════ */
.back{display:inline-flex;gap:6px;font-size:14px;font-weight:600;color:var(--sub);margin-bottom:var(--s3)}
.back:hover{color:var(--ink)}
.report-hero .title{max-width:880px}
.rgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:var(--s3);margin-top:var(--s5)}
.rcard{padding:var(--s4)}
.rcard h2{font-size:20px;font-weight:600;letter-spacing:-0.04em}
.rcard h2 + p{font-size:14px;color:var(--sub);margin-top:4px}
.tbl{width:100%;border-collapse:collapse;margin-top:var(--s3);font-size:15px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:12px 0;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{font-size:13px;color:var(--sub);font-weight:500}
.tbl .neg{color:var(--green)}
.tbl tfoot td{font-weight:600;font-size:17px;border-bottom:0;padding-top:16px}
.bars{margin-top:var(--s4);display:grid;gap:14px}
.bar__top{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:6px}
.bar__track{height:14px;border-radius:var(--r-pill);background:var(--gray);overflow:hidden}
.bar__fill{height:100%;border-radius:var(--r-pill);background:var(--ink);width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.bar__fill.is-green{background:var(--green)}
.big-num{font-size:clamp(34px,3.4vw,48px);font-weight:600;letter-spacing:-0.045em;line-height:1.15;color:var(--green);margin-top:var(--s2)}
.big-num small{font-size:16px;color:var(--ink);font-weight:500;margin-left:4px}
.range{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:6px;font-size:14px;color:var(--sub)}
.formula{margin-top:var(--s2);padding:12px 14px;border-radius:12px;background:var(--gray);font-size:13px;color:var(--sub);line-height:1.6}
.policies{display:grid;gap:var(--s2);margin-top:var(--s3)}
.policy{padding:var(--s3);background:#fff;border:1px solid var(--line);border-radius:14px}
.policy__top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s2)}
.policy h3{font-size:16px;font-weight:600;letter-spacing:-0.03em}
.policy__org{font-size:12px;color:var(--sub)}
.policy__amt{font-size:14px;font-weight:600;margin-top:6px}
.conds{list-style:none;padding:0;margin:10px 0 0;font-size:13px}
.conds li{display:flex;justify-content:space-between;gap:var(--s2);padding:6px 0;border-top:1px dashed var(--line)}
.conds li span:last-child{font-weight:600;white-space:nowrap}
.c-ok{color:var(--green)}.c-check{color:var(--ink)}.c-no{color:var(--sub)}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin-top:var(--s3)}
.tier{padding:var(--s3)}
.tier h3{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.tier h3 i{font-family:var(--en);font-style:italic;font-weight:400;color:var(--green);font-size:20px}
.tier ul{list-style:none;padding:0;margin:12px 0 0;font-size:14px;color:#3d413d}
.tier li{padding:8px 0;border-top:1px solid var(--line)}
.checklist{list-style:none;padding:0;margin:var(--s3) 0 0;display:grid;gap:6px}
.checklist label{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-size:15px}
.checklist input{width:18px;height:18px;margin-top:3px;accent-color:var(--green);flex:none}
.checklist .is-top label{border-color:var(--ink)}
.checklist small{display:block;color:var(--sub);font-size:13px}
.checklist .pin{font-size:11px;font-weight:700;color:var(--warn);margin-left:6px;letter-spacing:0}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--s2);margin-top:var(--s3)}
.fcard{padding:var(--s3);display:flex;flex-direction:column;gap:6px}
.fcard svg{width:100%;height:110px;margin-bottom:6px}
.fcard b{font-weight:600}
.fcard span{font-size:13px;color:var(--sub)}
.fcard .price{font-size:15px;font-weight:600;color:var(--ink);margin-top:auto;padding-top:8px}
.sup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--s2);margin-top:var(--s3)}
.docs{margin-top:var(--s3)}
.tabs{display:inline-flex;gap:2px;padding:3px;border-radius:var(--r-pill);background:var(--gray);flex-wrap:wrap}
.tabs button{height:38px;padding:0 16px;border-radius:var(--r-pill);font-size:14px;font-weight:500;color:var(--sub)}
.tabs button.is-on{background:#fff;color:var(--ink);font-weight:600}
.doc{margin-top:var(--s2);padding:var(--s3);background:#fff;border:1px solid var(--line);border-radius:14px;white-space:pre-wrap;font-family:var(--kr);font-size:14px;line-height:1.75;max-height:420px;overflow:auto}
.doc-bar{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);flex-wrap:wrap}
.rsec{margin-top:var(--s7)}
.rtabs{position:sticky;top:var(--nav-h);z-index:20;background:rgba(243,242,238,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:12px 0;margin-top:calc(var(--s3) * -1)}
.rtabs .tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%;width:max-content}
.rtabs .tabs::-webkit-scrollbar{display:none}
.rtabs .tabs button{flex:none}
[data-rp]{display:none}
[data-rp].is-on{display:block;animation:tabIn .45s cubic-bezier(.2,.7,.2,1) backwards}
.rgrid[data-rp].is-on{display:grid}
.rsec[data-rp]{margin-top:var(--s5)}
.rsec[data-rp] + .rsec[data-rp]{margin-top:var(--s7)}
.rgrid[data-rp]{margin-top:var(--s4)}
.rnext{display:flex;justify-content:space-between;gap:var(--s1);margin-top:var(--s5);padding-top:var(--s3);border-top:1px solid var(--line)}
.rsec > .title{font-size:clamp(24px,2.2vw,30px)}

/* ═════════ 이용 안내(#guide) ═════════ */
.steps5{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--ink);margin-top:var(--s5)}
.s5{padding:var(--s4) var(--s3) var(--s4) 0}
.s5 + .s5{padding-left:var(--s3);border-left:1px solid var(--line)}
.s5 i{display:block;font-family:var(--en);font-style:italic;font-size:56px;line-height:1;letter-spacing:0;color:var(--green)}
.s5 b{display:block;margin-top:var(--s3);font-size:18px;font-weight:600;letter-spacing:-0.035em}
.s5 p{margin-top:6px;font-size:15px;color:var(--sub)}
.faq{max-width:880px;margin:var(--s5) auto 0;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:var(--s2);padding:var(--s3) 0;font-size:18px;font-weight:600;letter-spacing:-0.03em}
