<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>방봄 · 온라인 모델하우스</title>
<meta name="description" content="대구로 오는 사람이 가 보지 않고도 집을 고르는 온라인 모델하우스. 2.5D 지도에서 미분양 아파트만 떠오르고, 내 조건을 넣으면 들어갈 수 있는 단지에 불이 켜져요.">
<meta property="og:title" content="방봄 · 온라인 모델하우스">
<meta property="og:description" content="내 조건으로 대출·지원 요건을 따져 대구 미분양 지도에 불을 켜고, 집 안을 3D로 둘러보며 가구까지 놓아봐요.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
/* VOICE: 차분한 안내 창구 / IDEA: 잿빛 점토 미니어처 도시 위에 미분양만 불이 켜지는 모형 / PICTURE: 지도 자체
   COLOUR·TYPE: MAP_STYLE_GUIDE v3 팔레트(크림 카드, 청록 포인트, 불빛 주황), Pretendard / LAYOUT: 화면 전체가 지도, 패널은 떠 있는 카드 */
@font-face{font-family:"PretendardLocal";font-weight:400;font-display:swap;src:url("fonts/Pretendard-Regular.woff2") format("woff2")}
@font-face{font-family:"PretendardLocal";font-weight:500;font-display:swap;src:url("fonts/Pretendard-Medium.woff2") format("woff2")}
@font-face{font-family:"PretendardLocal";font-weight:600;font-display:swap;src:url("fonts/Pretendard-SemiBold.woff2") format("woff2")}
@font-face{font-family:"PretendardLocal";font-weight:700;font-display:swap;src:url("fonts/Pretendard-Bold.woff2") format("woff2")}
:root{
  color-scheme:light;
  --bg:#E9EBE8; --card:#FBF7EF; --card-line:#EFE6D6; --ink:#2B2A28; --sub:#7A766F; --line:#E5DED1;
  --teal:#2E7D74; --teal-soft:#E3EFEC; --glow:#FFC46B; --orange:#C9772E; --orange-soft:#FBEBD9; --off:#8C8880; --off-soft:#EEEBE5;
  --tag:#3B3632; --shadow:0 6px 20px rgba(60,50,40,.10); --r:16px;
  --kr:"Pretendard","PretendardLocal",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--kr);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:999px;background:var(--teal);color:#fff;font-weight:600;font-size:15px;white-space:nowrap;transition:filter .15s,transform .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.98)}
.btn--ghost{background:#fff;color:var(--ink);border:1px solid var(--card-line)}
.btn--ghost:hover{background:#fff8ec;filter:none}
.btn--dark{background:var(--tag)}
.btn--sm{height:36px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.4;pointer-events:none}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:var(--r);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--card-line);background:#fff;font-size:14px;font-weight:500;white-space:nowrap}
.chip.is-on{background:var(--tag);color:#fff;border-color:var(--tag)}
.st{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.st--eligible,.st--on{background:var(--teal-soft);color:var(--teal)}
.st--needs_check,.st--dim{background:var(--orange-soft);color:var(--orange)}
.st--ineligible,.st--off{background:var(--off-soft);color:var(--off)}
.sample{font-size:11px;font-weight:600;color:var(--sub);background:var(--off-soft);border-radius:999px;padding:3px 7px;white-space:nowrap}
.muted{color:var(--sub)}.small{font-size:13px}

/* 상단 바 */
.top{position:fixed;inset:0 0 auto 0;z-index:30;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;pointer-events:none}
.top > *{pointer-events:auto}
.brand{text-decoration:none;display:flex;align-items:baseline;gap:6px;height:40px;padding:0 14px;border-radius:999px;background:rgba(251,247,239,.9);border:1px solid var(--card-line);align-items:center;font-weight:700;letter-spacing:-.04em;white-space:nowrap}
.brand small{font-weight:500;color:var(--sub);font-size:12px}
.dnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.dnav::-webkit-scrollbar{display:none}
.dnav button{flex:none;height:36px;padding:0 12px;border-radius:999px;background:rgba(251,247,239,.92);border:1px solid var(--card-line);font-size:13px;font-weight:600;white-space:nowrap}
.dnav button b{color:var(--teal);margin-left:3px}
.top-right{display:flex;gap:6px}

/* 지도 */
#mapWrap{position:fixed;inset:0}
#mapCredit{position:absolute;left:12px;bottom:8px;margin:0;font-size:11px;color:#71746f;pointer-events:none}
@media (max-width:820px){#mapCredit{bottom:80px}}
#mapCanvas{display:block;width:100%;height:100%;touch-action:none}
.lbl-layer{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.clabel{position:absolute;transform:translate(-50%,-100%);background:var(--tag);color:#fff;font-size:12px;font-weight:600;padding:5px 9px;border-radius:999px;white-space:nowrap;pointer-events:auto;cursor:pointer;display:flex;gap:6px;align-items:center;transition:opacity .2s}
.clabel i{font-style:normal;font-weight:700}
.clabel.is-on i{color:#7ED6C8}.clabel.is-dim i{color:#FFC46B}.clabel.is-off{background:#6E6A64}.clabel.is-off i{color:#D2CEC7}
.clabel.is-faint{opacity:.28}
.clabel.is-dot{width:12px;height:12px;padding:0;font-size:0;border:2px solid #fff}
.ilabel{position:absolute;transform:translate(-50%,-120%);background:#FFF8EC;border:1px solid var(--card-line);color:var(--ink);font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap;box-shadow:var(--shadow)}
.ilabel i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.score-badge{position:absolute;transform:translate(-50%,10px);background:#fff;border:1px solid var(--card-line);font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;color:var(--teal)}

/* 떠 있는 패널 */
.panel-l{position:fixed;left:16px;top:72px;z-index:20;width:360px;max-height:calc(100vh - 150px);overflow:auto}
.panel-r{position:fixed;right:16px;top:72px;z-index:21;width:380px;max-height:calc(100vh - 190px);overflow:auto;transform:translateX(24px);opacity:0;pointer-events:none;transition:transform .3s,opacity .3s}
.panel-r.is-open{transform:none;opacity:1;pointer-events:auto}
.mpad{padding:18px}
.pills-r{position:fixed;right:16px;top:72px;z-index:19;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:420px}
.pill-n{height:34px;padding:0 12px;border-radius:999px;background:rgba(251,247,239,.94);border:1px solid var(--card-line);font-size:13px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pill-n b{font-weight:700}
.legend{position:fixed;left:16px;bottom:52px;z-index:18;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 120px)}
.legend span{height:30px;padding:0 10px;border-radius:999px;background:rgba(251,247,239,.94);border:1px solid var(--card-line);font-size:12px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{width:8px;height:8px;border-radius:50%}
.notice{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:25;font-size:12px;color:var(--sub);background:rgba(251,247,239,.94);border:1px solid var(--card-line);padding:6px 12px;border-radius:999px;white-space:nowrap;pointer-events:none}
.fab{position:fixed;right:16px;bottom:48px;z-index:26;height:52px;padding:0 20px;border-radius:999px;background:var(--teal);color:#fff;font-weight:700;box-shadow:0 8px 24px rgba(46,125,116,.35);display:flex;align-items:center;gap:8px}
.fab i{width:8px;height:8px;border-radius:50%;background:#7ED6C8;box-shadow:0 0 0 4px rgba(126,214,200,.25)}

/* 판정 패널 */
.jp h2{font-size:17px;font-weight:700;letter-spacing:-.03em}
.jp-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.jp-date{font-size:12px;color:var(--sub)}
.jp-sec{margin-top:14px;font-size:12px;font-weight:700;color:var(--sub)}
.jp-row{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.jp-row .nm{font-weight:600;font-size:14px;line-height:1.35}
.jp-more{grid-column:1/-1;font-size:13px;color:var(--sub);display:none;padding:2px 0 4px 24px}
.jp-row.is-open .jp-more{display:block}
.ico{font-size:15px;line-height:1;width:16px;text-align:center}
.ico.eligible{color:var(--teal)}.ico.needs_check{color:var(--orange)}.ico.ineligible{color:var(--off)}
.bar3{display:flex;height:10px;border-radius:999px;overflow:hidden;margin-top:14px;background:var(--off-soft)}
.bar3 span{display:block;height:100%}
.bar3-txt{font-size:13px;margin-top:6px;font-weight:600}
.jp-btns{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.jp-fold{font-size:13px;color:var(--sub);font-weight:600}

/* 단지 카드 */
.cc h2{font-size:19px;font-weight:700;letter-spacing:-.035em;line-height:1.3}
.cc-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.x{width:34px;height:34px;border-radius:50%;border:1px solid var(--card-line);background:#fff;display:grid;place-items:center;flex:none}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:#fff;border:1px solid var(--card-line);white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:14px;font-size:14px}
.kv dt{color:var(--sub)}.kv dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.big{margin-top:16px;font-size:13px;color:var(--sub)}
.big b{display:block;font-size:30px;line-height:1.2;color:var(--teal);font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.big b.is-off{color:var(--off)}
.why{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid var(--card-line);font-size:13px}
details.fold{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.fold summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"+";color:var(--sub)}
details.fold[open] summary::after{content:"−"}
.calc{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;font-variant-numeric:tabular-nums}
.calc td{padding:6px 0;border-bottom:1px dashed var(--line)}
.calc td:last-child{text-align:right;white-space:nowrap}
.calc tr.tot td{font-weight:700;border-bottom:0;font-size:14px}
.calc .neg{color:var(--teal)}
.lst{list-style:none;padding:0;margin:8px 0 0;font-size:13px}
.lst li{padding:6px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px}
.lst li span:last-child{white-space:nowrap;color:var(--sub)}
.chk{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.chk label{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:10px 12px;border:1px solid var(--card-line);border-radius:12px;background:#fff;cursor:pointer}
.chk input{width:16px;height:16px;margin-top:2px;accent-color:var(--teal);flex:none}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.links a,.links span{font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--card-line);text-decoration:none;white-space:nowrap}
.links a:hover{border-color:var(--teal);color:var(--teal)}
.cc-btns{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.cc-btns .btn{flex:1 1 auto}

/* 시작·입력 화면 */
.veil{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:76px 16px 56px;background:rgba(233,235,232,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);overflow:auto}
.start{width:min(560px,100%);padding:32px}
.start .eyebrow{font-size:13px;font-weight:700;color:var(--teal)}
.start h1{margin-top:10px;font-size:clamp(28px,4vw,38px);line-height:1.2;letter-spacing:-.05em;font-weight:700;text-wrap:balance}
.start p{margin-top:12px;color:var(--sub)}
.start-btns{display:grid;gap:10px;margin-top:24px}
.big-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-radius:14px;border:1px solid var(--card-line);background:#fff;text-align:left;transition:border-color .15s,transform .15s}
.big-btn:hover{border-color:var(--teal);transform:translateY(-1px)}
.big-btn b{display:block;font-size:17px;letter-spacing:-.03em}
.big-btn span{font-size:13px;color:var(--sub)}
.big-btn.is-main{background:var(--teal);color:#fff;border-color:var(--teal)}
.big-btn.is-main span{color:rgba(255,255,255,.8)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:22px}
.facts div{padding:12px;border-radius:12px;background:#fff;border:1px solid var(--card-line)}
.facts b{display:block;font-size:20px;letter-spacing:-.04em;color:var(--teal);font-variant-numeric:tabular-nums}
.facts span{font-size:12px;color:var(--sub);line-height:1.4;display:block}
.facts-src{font-size:11px;color:var(--sub);margin-top:6px}

.form{width:min(620px,100%);padding:26px}
.form h1{font-size:22px;letter-spacing:-.04em}
.form .sub{color:var(--sub);font-size:14px;margin-top:4px}
.persona{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin-top:18px}
.f label,.f .lb{display:flex;justify-content:space-between;gap:6px;font-size:13px;font-weight:700;margin-bottom:6px}
.f label small,.f .lb small{font-weight:500;color:var(--sub)}
.in{display:flex;align-items:center;gap:6px}
.in input{width:100%;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--card-line);background:#fff;font-size:16px;font-variant-numeric:tabular-nums}
.in input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.in span{font-size:13px;color:var(--sub);white-space:nowrap}
.seg{display:flex;padding:3px;border-radius:999px;background:#EFEAE0;gap:2px}
.seg button{flex:1;height:38px;border-radius:999px;font-size:14px;color:var(--sub);white-space:nowrap}
.seg button.is-on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.f.full{grid-column:1/-1}
.err{color:#B4453A;font-size:12px;margin-top:4px;min-height:0}
.form-btns{display:flex;gap:8px;margin-top:22px;justify-content:flex-end;flex-wrap:wrap}

/* 상담 서랍 */
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:60;width:min(400px,100%);background:var(--card);border-left:1px solid var(--card-line);box-shadow:-10px 0 30px rgba(60,50,40,.12);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.drawer.is-open{transform:none}
.dr-head{padding:14px 16px;border-bottom:1px solid var(--card-line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.dr-head b{font-size:16px}
.dr-note{font-size:12px;color:var(--sub);padding:8px 16px;background:#F6EFE2}
.dr-body{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--card-line);border-bottom-left-radius:4px}
.msg .links{margin-top:8px}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--card-line)}
.quick button{font-size:13px;padding:7px 11px;border-radius:999px;border:1px solid var(--card-line);background:#fff;text-align:left}
.dr-input{display:flex;gap:6px;padding:10px 16px 16px}
.dr-input input{flex:1;height:44px;border-radius:999px;border:1px solid var(--card-line);padding:0 14px;font-size:16px;background:#fff}

/* 집 보기 */
#houseView{position:fixed;inset:0;z-index:50;background:#EFEDE8;display:none}
#houseView.is-on{display:block}
#houseCanvas{display:block;width:100%;height:100%;touch-action:none}
.hv-top{position:absolute;left:16px;right:16px;top:12px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap;z-index:3;pointer-events:none}
.hv-top > *{pointer-events:auto}
.hv-title{padding:10px 14px}
.hv-title b{display:block;font-size:16px;letter-spacing:-.03em}
.hv-title span{font-size:12px;color:var(--sub)}
.segw{display:flex;padding:3px;border-radius:999px;background:rgba(251,247,239,.95);border:1px solid var(--card-line);gap:2px}
.segw button{height:36px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--sub);white-space:nowrap}
.segw button.is-on{background:var(--tag);color:#fff}
.hv-side{position:absolute;right:16px;top:76px;bottom:16px;width:340px;z-index:3;display:flex;flex-direction:column;overflow:hidden}
.hv-tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--card-line);flex:none}
.hv-tabs button{padding:12px 4px;font-size:14px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
.hv-tabs button.is-on{color:var(--ink);border-bottom-color:var(--ink)}
.hv-body{flex:1;overflow:auto;padding:14px 16px}
.hv-body h3{font-size:14px;margin:14px 0 8px}
.hv-body h3:first-child{margin-top:0}
.pal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pal button{padding:10px;border:1px solid var(--card-line);border-radius:12px;background:#fff;text-align:left;font-size:13px}
.pal button b{display:block;font-size:13px}
.pal button span{color:var(--sub);font-size:12px}
.sel-bar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;display:none;gap:6px;padding:6px;border-radius:999px;background:var(--tag);color:#fff;align-items:center}
.sel-bar.is-on{display:flex}
.sel-bar span{font-size:13px;padding:0 10px;white-space:nowrap}
.sel-bar button{height:36px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.rooms-bar{position:absolute;left:16px;bottom:16px;z-index:4;display:none;gap:6px;flex-wrap:wrap;max-width:calc(100% - 400px)}
.rooms-bar.is-on{display:flex}
.hv-hint{position:absolute;left:16px;top:76px;z-index:3;font-size:12px;color:var(--sub);background:rgba(251,247,239,.92);border:1px solid var(--card-line);padding:6px 10px;border-radius:999px}
.hv-lbl{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.rlabel{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:700;color:var(--ink);background:rgba(251,247,239,.85);padding:2px 7px;border-radius:6px;white-space:nowrap}
.dimlabel{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:700;color:var(--teal);background:#EFEDE8;padding:0 4px;white-space:nowrap}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-top:1px solid var(--line);margin-top:10px;font-weight:700}
.tot b{font-size:20px;color:var(--teal);font-variant-numeric:tabular-nums}
.buy{list-style:none;padding:0;margin:0}
.buy li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px}
.buy li b{font-size:14px}
.buy li .p{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.buy li .s{color:var(--sub)}
.budget{display:flex;gap:6px;align-items:center}
.budget input{flex:1;height:42px;border-radius:12px;border:1px solid var(--card-line);padding:0 12px;font-size:16px;background:#fff}
.toast{position:fixed;left:50%;bottom:64px;transform:translate(-50%,10px);z-index:90;background:var(--tag);color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}

@media (max-width:900px){
  .hv-side{top:auto;left:0;right:0;bottom:0;width:auto;height:44vh;border-radius:18px 18px 0 0}
  .rooms-bar{bottom:calc(44vh + 10px);max-width:calc(100% - 32px)}
  .sel-bar{bottom:calc(44vh + 10px)}
  .hv-hint{display:none}
}
@media (max-width:768px){
  body{font-size:15px}
  .top{height:56px;padding:0 10px}
  .brand small{display:none}
  .dnav{position:fixed;left:0;right:0;top:56px;padding:0 10px}
  .top-right .btn{height:36px;padding:0 12px;font-size:13px}
  .panel-l{left:10px;right:10px;top:104px;width:auto;max-height:38vh}
  .panel-r{left:0;right:0;top:auto;bottom:0;width:auto;max-height:72vh;border-radius:18px 18px 0 0;transform:translateY(30px)}
  .panel-r.is-open{transform:none}
  .pills-r{display:none}
  .clabel{font-size:11px;padding:4px 8px}
  .legend .cat{display:none}
  body.card-open .fab{display:none}
  .legend{bottom:44px;left:10px}
  .fab{right:10px;bottom:84px;height:48px;padding:0 16px}
  .notice{font-size:11px;bottom:8px;white-space:normal;text-align:center;width:calc(100% - 20px);border-radius:12px}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .facts b{font-size:17px}
  .start{padding:22px}
  .form{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
